<link href="style.css" rel="stylesheet">
</head>
<body>
<div id="spin" class="spin d-none"><div class="spinner-border text-light"></div></div>
<div id="toasts"></div>

<section id="login" class="d-none">
  <form id="loginForm" class="card shadow login-card">
    <div class="card-body p-4">
      <h4 class="fw-bold brand-title mb-1">KU Blora</h4>
      <p class="text-muted small mb-3">Pencatatan &amp; rekapitulasi nominal enam wilayah</p>
      <input id="lu" class="form-control mb-2" placeholder="Username" autocomplete="username" required>
      <input id="lp" type="password" class="form-control mb-2" placeholder="Password" autocomplete="current-password" required>
      <div id="lerr" class="text-danger small mb-2"></div>
      <button id="loginBtn" class="btn btn-primary w-100">Masuk</button>
    </div>
  </form>
</section>

<div id="app" class="d-none">
  <aside id="side">
    <div class="side-head"><span class="logo">KB</span><span class="tx brand-name">KU Blora</span></div>
    <ul id="tabs" class="nav flex-column"></ul>
    <div class="side-foot">
      <div id="who" class="tx mb-2"></div>
      <button id="logoutBtn" class="btn btn-sm btn-outline-warning w-100">⎋<span class="tx"> Keluar</span></button>
    </div>
  </aside>
  <div id="scrim"></div>
  <div id="content">
    <header class="topbar"><button id="burger" class="btn btn-sm btn-outline-primary" aria-label="Menu">☰</button><span id="ttl" class="fw-semibold"></span></header>
    <main id="view" class="container-fluid py-3"></main>
  </div>
</div>

<div class="modal fade" id="modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 id="mTitle" class="modal-title"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="mBody"></div>
      <div class="modal-footer" id="mFoot"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
