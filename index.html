<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KU Blora — Pencatatan Keuangan Desa</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>
<div id="spin" class="spin d-none"><div class="spinner-border text-light"></div></div>
<div id="toasts"></div>

<section id="login" class="d-none">
  <form id="loginForm" class="card shadow-sm login-card">
    <div class="card-body p-4">
      <h4 class="fw-bold text-primary mb-1">KU Blora</h4>
      <p class="text-muted small mb-3">Pencatatan &amp; rekapitulasi keuangan bulanan desa</p>
      <input id="lu" class="form-control mb-2" placeholder="Username" autocomplete="username" required>
      <input id="lp" type="password" class="form-control mb-2" placeholder="Password" autocomplete="current-password" required>
      <div id="lerr" class="text-danger small mb-2"></div>
      <button id="loginBtn" class="btn btn-primary w-100">Masuk</button>
    </div>
  </form>
</section>

<div id="app" class="d-none">
  <nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand fw-bold mb-0">KU Blora</span>
    <span class="d-flex align-items-center gap-2 text-white small">
      <span id="who" class="text-truncate"></span>
      <button id="logoutBtn" class="btn btn-sm btn-light">Keluar</button>
    </span>
  </nav>
  <ul id="tabs" class="nav nav-pills gap-1 px-3 py-2 bg-white border-bottom flex-nowrap overflow-auto"></ul>
  <main id="view" class="container-fluid py-3"></main>
</div>

<div class="modal fade" id="modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h5 id="mTitle" class="modal-title"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="mBody"></div>
      <div class="modal-footer" id="mFoot"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
